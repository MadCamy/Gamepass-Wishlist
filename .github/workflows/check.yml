name: Game Pass check

on:
  schedule:
    # 7pm New York time. Cron is UTC-only, so both offsets are scheduled and the
    # gate job below keeps whichever matches daylight saving time today.
    - cron: '0 23 * * *' # 7pm EDT (summer)
    - cron: '0 0 * * *' # 7pm EST (winter)
  workflow_dispatch: # "Run workflow" button for manual runs

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tz.outputs.run }}
    steps:
      - id: tz
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)
          if [ -z "$SCHEDULE" ] \
            || { [ "$SCHEDULE" = '0 23 * * *' ] && [ "$zone" = EDT ]; } \
            || { [ "$SCHEDULE" = '0 0 * * *' ] && [ "$zone" = EST ]; }; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this slot isn't 7pm New York time while on $zone"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  # Holds the secrets, but can only read the repo: no deploy or token permissions.
  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Compare wishlist with Game Pass
        run: node src/main.js
        env:
          STEAM_PROFILE: ${{ secrets.STEAM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  # Publishes the dashboard; never sees the secrets.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

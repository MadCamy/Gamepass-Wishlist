name: Game Pass check

on:
  schedule:
    # 7pm New York time. Cron is UTC-only, so both offsets are scheduled and the
    # gate job below keeps whichever matches daylight saving time today.
    - cron: '0 23 * * *' # 7pm EDT (summer)
    - cron: '0 0 * * *' # 7pm EST (winter)
  workflow_dispatch: # "Run workflow" button for manual runs

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: gamepass-check
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tz.outputs.run }}
    steps:
      - id: tz
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)
          if [ -z "$SCHEDULE" ] \
            || { [ "$SCHEDULE" = '0 23 * * *' ] && [ "$zone" = EDT ]; } \
            || { [ "$SCHEDULE" = '0 0 * * *' ] && [ "$zone" = EST ]; }; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this slot isn't 7pm New York time while on $zone"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  # Holds the secrets, but can only read the repo.
  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Last run's snapshot, so only changes get emailed. Kept in the Actions cache,
      # which (unlike artifacts or Pages) the public can't download.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/data.json
          key: gpw-state-${{ github.run_id }}
          restore-keys: gpw-state-
      - name: Compare wishlist with Game Pass
        run: node src/main.js
        env:
          STEAM_PROFILE: ${{ secrets.STEAM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/data.json
          key: gpw-state-${{ github.run_id }}

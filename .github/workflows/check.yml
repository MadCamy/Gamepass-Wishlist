name: Game Pass check

on:
  schedule:
    - cron: '0 14 * * *' # daily, 14:00 UTC
  workflow_dispatch: # "Run workflow" button for manual runs

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Holds the secrets, but can only read the repo: no deploy or token permissions.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Compare wishlist with Game Pass
        run: node src/main.js
        env:
          STEAM_PROFILE: ${{ secrets.STEAM_PROFILE }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  # Publishes the dashboard; never sees the secrets.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
